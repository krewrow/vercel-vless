```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Rotating Globe</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at center, #07152d 0%, #020711 45%, #000 100%);
    font-family: Arial, "Microsoft YaHei", sans-serif;
    color: #fff;
}

/* =========================
   星空
========================= */

.stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: .7;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: .2;
    }

    to {
        opacity: 1;
    }
}

/* =========================
   页面
========================= */

.container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
}

/* =========================
   球体
========================= */

.globe-wrapper {
    position: relative;
    width: 420px;
    height: 420px;

    transform-style: preserve-3d;

    cursor: grab;

    filter:
        drop-shadow(0 0 30px rgba(0, 170, 255, .25))
        drop-shadow(0 0 80px rgba(0, 100, 255, .15));
}

.globe-wrapper:active {
    cursor: grabbing;
}

/* 球体内部 */

.globe {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 320px;
    height: 320px;

    margin-left: -160px;
    margin-top: -160px;

    border-radius: 50%;

    transform-style: preserve-3d;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,.35),
            rgba(0,170,255,.15) 15%,
            rgba(0,80,180,.15) 45%,
            rgba(0,20,70,.4) 75%,
            rgba(0,0,0,.8) 100%
        );

    box-shadow:
        inset -35px -25px 70px rgba(0,0,0,.8),
        inset 15px 10px 30px rgba(255,255,255,.08),
        0 0 20px rgba(0,180,255,.5),
        0 0 70px rgba(0,130,255,.25);
}

/* =========================
   经纬线
========================= */

.line {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 320px;
    height: 320px;

    margin-left: -160px;
    margin-top: -160px;

    border: 1px solid rgba(0, 200, 255, .55);

    border-radius: 50%;

    transform-style: preserve-3d;

    pointer-events: none;
}

/* 纬线 */

.latitude {
    width: 320px;
    height: 80px;

    margin-left: -160px;
    margin-top: -40px;

    transform: rotateX(90deg);
}

/* 赤道 */

.equator {
    transform: rotateX(90deg);
}

/* 经线 */

.longitude {
    transform: rotateY(0deg);
}

.longitude:nth-child(2) {
    transform: rotateY(30deg);
}

.longitude:nth-child(3) {
    transform: rotateY(60deg);
}

.longitude:nth-child(4) {
    transform: rotateY(90deg);
}

.longitude:nth-child(5) {
    transform: rotateY(120deg);
}

.longitude:nth-child(6) {
    transform: rotateY(150deg);
}

/* =========================
   外部光环
========================= */

.orbit {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 430px;
    height: 150px;

    margin-left: -215px;
    margin-top: -75px;

    border: 1px solid rgba(0, 190, 255, .35);

    border-radius: 50%;

    transform-style: preserve-3d;

    transform: rotateX(65deg) rotateZ(-20deg);

    box-shadow:
        0 0 20px rgba(0,180,255,.15),
        inset 0 0 20px rgba(0,180,255,.1);
}

.orbit::before {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    background: #00d9ff;

    border-radius: 50%;

    left: 20%;
    top: 15%;

    box-shadow:
        0 0 10px #00d9ff,
        0 0 30px #00d9ff;
}

/* =========================
   光晕
========================= */

.glow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 360px;
    height: 360px;

    margin-left: -180px;
    margin-top: -180px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(0,180,255,.08),
        rgba(0,100,255,.03) 50%,
        transparent 70%
    );

    pointer-events: none;
}

/* =========================
   UI
========================= */

.title {
    position: fixed;

    top: 45px;
    left: 50%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 10;
}

.title h1 {
    font-size: 28px;
    letter-spacing: 8px;

    font-weight: 300;

    text-shadow:
        0 0 10px rgba(0,200,255,.8),
        0 0 30px rgba(0,100,255,.5);
}

.title p {
    margin-top: 10px;

    font-size: 12px;

    letter-spacing: 4px;

    color: rgba(255,255,255,.45);
}

.info {
    position: fixed;

    bottom: 35px;
    left: 50%;

    transform: translateX(-50%);

    color: rgba(255,255,255,.45);

    font-size: 12px;

    letter-spacing: 2px;

    text-align: center;
}

.speed {
    position: fixed;

    right: 30px;
    bottom: 30px;

    padding: 10px 15px;

    border: 1px solid rgba(0,180,255,.25);

    border-radius: 6px;

    background: rgba(0,30,60,.25);

    backdrop-filter: blur(8px);

    font-size: 12px;

    color: rgba(255,255,255,.6);
}
</style>
</head>

<body>

<!-- 星空 -->
<div class="stars" id="stars"></div>

<div class="title">
    <h1>3D GLOBE</h1>
    <p>PURE HTML · CSS · JAVASCRIPT</p>
</div>

<div class="container">

    <div class="globe-wrapper" id="globeWrapper">

        <!-- 外部轨道 -->
        <div class="orbit"></div>

        <!-- 光晕 -->
        <div class="glow"></div>

        <!-- 球体 -->
        <div class="globe">

            <!-- 纬线 -->
            <div class="line latitude"></div>

            <div class="line latitude"
                 style="transform: rotateX(90deg) scaleY(.55);">
            </div>

            <div class="line latitude"
                 style="transform: rotateX(90deg) scaleY(.25);">
            </div>

            <!-- 赤道 -->
            <div class="line equator"></div>

            <!-- 经线 -->
            <div class="line longitude"></div>

            <div class="line longitude"></div>
            <div class="line longitude"></div>
            <div class="line longitude"></div>
            <div class="line longitude"></div>
            <div class="line longitude"></div>

        </div>

    </div>

</div>

<div class="info">
    拖动旋转 · 滚轮缩放 · 点击改变速度
</div>

<div class="speed" id="speed">
    SPEED × 1.0
</div>

<script>
/* =========================
   星空生成
========================= */

const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    const size = Math.random() * 2 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    stars.appendChild(star);
}


/* =========================
   3D 控制
========================= */

const wrapper =
    document.getElementById("globeWrapper");

const speedText =
    document.getElementById("speed");

let rotateX = -15;
let rotateY = 0;

let autoSpeed = 0.25;

let scale = 1;

let dragging = false;

let lastX = 0;
let lastY = 0;


/* =========================
   自动旋转
========================= */

function animate() {

    if (!dragging) {

        rotateY += autoSpeed;

    }

    wrapper.style.transform =
        `rotateX(${rotateX}deg)
         rotateY(${rotateY}deg)
         scale(${scale})`;

    requestAnimationFrame(animate);
}

animate();


/* =========================
   鼠标拖动
========================= */

wrapper.addEventListener(
    "mousedown",
    function(e) {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

    }
);

window.addEventListener(
    "mouseup",
    function() {

        dragging = false;

    }
);

window.addEventListener(
    "mousemove",
    function(e) {

        if (!dragging) return;

        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;

        rotateY += dx * .5;

        rotateX -= dy * .5;

        rotateX =
            Math.max(
                -85,
                Math.min(85, rotateX)
            );

        lastX = e.clientX;
        lastY = e.clientY;

    }
);


/* =========================
   鼠标滚轮缩放
========================= */

wrapper.addEventListener(
    "wheel",
    function(e) {

        e.preventDefault();

        scale +=
            e.deltaY > 0
                ? -0.08
                : 0.08;

        scale =
            Math.max(
                .65,
                Math.min(1.5, scale)
            );

    },
    { passive: false }
);


/* =========================
   点击改变速度
========================= */

wrapper.addEventListener(
    "click",
    function() {

        autoSpeed += .25;

        if (autoSpeed > 2) {
            autoSpeed = .25;
        }

        speedText.innerText =
            "SPEED × " +
            (autoSpeed / .25).toFixed(1);

    }
);


/* =========================
   手机触摸
========================= */

let touchX = 0;
let touchY = 0;

wrapper.addEventListener(
    "touchstart",
    function(e) {

        dragging = true;

        touchX =
            e.touches[0].clientX;

        touchY =
            e.touches[0].clientY;

    },
    { passive: true }
);

wrapper.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging) return;

        const x =
            e.touches[0].clientX;

        const y =
            e.touches[0].clientY;

        rotateY +=
            (x - touchX) * .5;

        rotateX -=
            (y - touchY) * .5;

        rotateX =
            Math.max(
                -85,
                Math.min(85, rotateX)
            );

        touchX = x;
        touchY = y;

    },
    { passive: true }
);

wrapper.addEventListener(
    "touchend",
    function() {

        dragging = false;

    }
);
</script>

</body>
</html>
